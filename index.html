<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Hunt 2026 — Freshers' Treasure Hunt Adventure</title>
    <meta name="description" content="Join the ultimate campus treasure hunt! Solve riddles, find hidden spots, and compete with your team in the Campus Hunt 2026 adventure." />

    <!-- Speed Optimization: Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://images.pexels.com" />

    <!-- Speed Optimization: Async Font Loading -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;700;800&family=Syne:wght@700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Critical CSS for instant HUD display -->
    <style>
      :root {
        --color-void: #05070f;
        --color-text: #e2e8f0;
        --color-cyan: #22d3ee;
      }
      body {
        background: var(--color-void);
        color: var(--color-text);
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .tech-bg { position: fixed; inset: 0; z-index: 0; background: #05070f; }
      #root { min-height: 100dvh; position: relative; z-index: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

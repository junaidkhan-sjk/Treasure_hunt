<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e0e5ec" />

    <meta name="description" content="Join the ultimate campus treasure hunt! Solve riddles, find hidden spots, and compete with your team in the Campus Hunt 2026 adventure." />

    <!-- Critical CSS for Neomorphic HUD -->
    <style>
      :root {
        --color-bg-neo: #e0e5ec;
        --color-text: #444444;

      body {
        background: var(--color-bg-neo);
        color: var(--color-text);
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .tech-bg { position: fixed; inset: 0; z-index: 0; background: #e0e5ec; }
      #root { min-height: 100dvh; position: relative; z-index: 1; }
